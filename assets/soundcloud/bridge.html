<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: transparent; overflow: hidden; }
  iframe { border: 0; width: 100%; height: 100%; display: block; }
</style>
</head>
<body>
<!-- SoundCloud's official embedded player. AURA controls it only through
     the official Widget API (https://developers.soundcloud.com/docs/api/html5-widget). -->
<iframe id="sc" allow="autoplay; encrypted-media" src="{{WIDGET_URL}}"></iframe>
<script src="https://w.soundcloud.com/player/api.js"></script>
<script>
(function () {
  'use strict';
  var widget = SC.Widget(document.getElementById('sc'));
  var E = SC.Widget.Events;
  var lastProgress = 0;

  // To AURA: the native channel on iOS/Android, the parent window on the web.
  function send(message) {
    message.source = 'aura-sc';
    var text = JSON.stringify(message);
    if (window.AuraBridge && window.AuraBridge.postMessage) {
      window.AuraBridge.postMessage(text);
    } else if (window.parent && window.parent !== window) {
      window.parent.postMessage(text, '*');
    }
  }

  // Only the fields AURA shows; nothing else leaves the widget.
  function toSound(s) {
    s = s || {};
    return {
      title: s.title || null,
      author: (s.user && s.user.username) || null,
      artwork: s.artwork_url || (s.user && s.user.avatar_url) || null,
      durationMs: s.duration || null,
      url: s.permalink_url || null
    };
  }

  function sendSounds() {
    widget.getSounds(function (sounds) {
      send({ type: 'sounds', sounds: (sounds || []).map(toSound) });
    });
  }

  widget.bind(E.READY, function () {
    send({ type: 'ready' });
    sendSounds();
  });
  widget.bind(E.PLAY, function () {
    widget.getCurrentSoundIndex(function (index) {
      send({ type: 'play', index: index });
      // Long playlists load details lazily: refresh what AURA shows.
      sendSounds();
    });
  });
  widget.bind(E.PAUSE, function () { send({ type: 'pause' }); });
  widget.bind(E.FINISH, function () { send({ type: 'finish' }); });
  widget.bind(E.ERROR, function () { send({ type: 'error' }); });
  widget.bind(E.PLAY_PROGRESS, function (e) {
    var now = Date.now();
    if (now - lastProgress < 1000) return;
    lastProgress = now;
    widget.getCurrentSoundIndex(function (index) {
      send({ type: 'progress', positionMs: Math.round(e.currentPosition || 0), index: index });
    });
  });

  // From AURA: a fixed set of commands; anything else is ignored.
  window.auraCommand = function (command) {
    if (!command || command.target !== 'aura-sc') return;
    switch (command.type) {
      case 'play': widget.play(); break;
      case 'pause': widget.pause(); break;
      case 'next': widget.next(); break;
      case 'prev': widget.prev(); break;
      case 'skip':
        if (typeof command.index === 'number') widget.skip(command.index);
        break;
      case 'seek':
        if (typeof command.positionMs === 'number') widget.seekTo(command.positionMs);
        break;
    }
  };
  window.addEventListener('message', function (event) {
    if (event.source !== window.parent || typeof event.data !== 'string') return;
    try { window.auraCommand(JSON.parse(event.data)); } catch (e) { /* not ours */ }
  });
})();
</script>
</body>
</html>
