name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.47.7

jobs:
  test:
    name: Format, analyze, test
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-flutter
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze

      - name: Test (random order)
        run: >-
          flutter test --test-randomize-ordering-seed random
          --file-reporter json:test-results.json

      # Step logs need a GitHub login; annotations are public, so each
      # failing test is reported as one with its name and error.
      - name: Annotate failing tests
        if: failure()
        run: |
          jq -rs '
            def esc: gsub("%"; "%25") | gsub("\r"; "%0D") | gsub("\n"; "%0A");
            (map(select(.type == "testStart"))
              | map({key: (.test.id | tostring), value: .test.name})
              | from_entries) as $names
            | map(select(.type == "error"))[]
            | "::error title=\($names[.testID | tostring] // "test"
                | gsub("[,:]"; " ") | esc)::\(.error[0:2000] | esc)"
          ' test-results.json

  ios:
    name: Build iOS (simulator)
    needs: test
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-flutter
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Toolchain
        run: |
          sw_vers
          xcodebuild -version

      # A simulator build needs no code signing, so no secrets are involved.
      - name: Build for iOS Simulator
        run: flutter build ios --simulator --debug
